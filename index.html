<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste Player LoveSongs</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  background: #000;
  font-family: Arial, sans-serif;
  color: #fff;
}

/* Container principal */
.player-container {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* 50% vídeo */
.video-area {
  flex: 1;
  position: relative;
}

/* 50% controles */
.controls-area {
  flex: 1;
  background: #111;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 25px;
}

/* Iframe ocupa tudo */
.video-area iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* Botões fake apenas visuais */
.controls {
  display: flex;
  gap: 40px;
}

button {
  background: #1db954;
  border: none;
  color: white;
  padding: 15px 25px;
  font-size: 18px;
  border-radius: 50px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #1ed760;
}
</style>

</head>
<body>

<div class="player-container">

  <!-- 50% SUPERIOR -->
  <div class="video-area">
    <iframe
      src="https://www.youtube-nocookie.com/embed/8RqnQKSP_Rk"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <!-- 50% INFERIOR -->
  <div class="controls-area">
    <h2>LoveSongs Test</h2>
    <div class="controls">
      <button>⏮</button>
      <button>▶</button>
      <button>⏭</button>
    </div>
  </div>

</div>

</body>
</html>
